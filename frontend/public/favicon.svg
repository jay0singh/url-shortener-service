<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#6366f1"/>
  <g transform="translate(50,50)" fill="none" stroke="white" stroke-width="8" stroke-linecap="round">
    <!-- left link -->
    <rect x="-38" y="-15" width="34" height="30" rx="15" fill="none" stroke="white" stroke-width="8"/>
    <!-- right link -->
    <rect x="4" y="-15" width="34" height="30" rx="15" fill="none" stroke="white" stroke-width="8"/>
    <!-- overlap cover left -->
    <line x1="-4" y1="-14" x2="-4" y2="14" stroke="#6366f1" stroke-width="10"/>
    <!-- overlap cover right -->
    <line x1="4" y1="-14" x2="4" y2="14" stroke="#6366f1" stroke-width="10"/>
  </g>
</svg>
