spring.application.name=url-shortener-service

server.port=${PORT:8090}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

app.base-url=http://localhost:8090
app.cors.allowed-origins=*
app.rate-limit.shorten=10
app.rate-limit.redirect=60

# Cache configuration
spring.cache.cache-names=redirects
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m,recordStats

# Actuator
management.endpoints.web.exposure.include=health,info,caches,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=url-shortener-service
info.app.description=URL Shortener Service

# Logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{cid}] %-5level %logger - %msg%n